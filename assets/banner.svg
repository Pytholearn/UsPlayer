      <rect x="1198" y="344" width="14" height="8" rx="2"/>
      <rect x="1234" y="8" width="14" height="8" rx="2"/>
      <rect x="1234" y="344" width="14" height="8" rx="2"/>
      <rect x="1270" y="8" width="14" height="8" rx="2"/>
      <rect x="1270" y="344" width="14" height="8" rx="2"/>
    </g>

    <!-- the mark: three figures, the middle one playing -->
    <g transform="translate(120 72)">
      <circle cx="44" cy="70" r="36" fill="url(#figure)" opacity="0.9"/>
      <path d="M0 176 C0 128 22 110 44 110 C66 110 88 128 88 176 Z" fill="url(#figure)" opacity="0.9"/>
      <circle cx="196" cy="70" r="36" fill="url(#figure)" opacity="0.9"/>
      <path d="M152 176 C152 128 174 110 196 110 C218 110 240 128 240 176 Z" fill="url(#figure)" opacity="0.9"/>
      <circle cx="120" cy="52" r="58" fill="#2b7fff" opacity="0.45" filter="url(#soft)">
        <animate attributeName="opacity" values="0.25;0.6;0.25" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="52" r="50" fill="url(#figure)"/>
      <path d="M44 176 C44 116 82 100 120 100 C158 100 196 116 196 176 Z" fill="url(#figure)"/>
      <path d="M106 30 L106 74 L142 52 Z" fill="#ffffff" fill-opacity="0.95" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <rect x="-4" y="192" width="248" height="6" rx="3" fill="url(#track)" opacity="0.35"/>
    </g>

    <!-- name and taglines -->
    <text x="430" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">Us Player</text>
    <text x="434" y="184" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#a9c4ef">Watch together, enjoy together</text>
    <text x="434" y="226" direction="rtl" unicode-bidi="embed" text-anchor="end" font-family="Vazirmatn, Tahoma, 'Segoe UI', 'Noto Naskh Arabic', sans-serif" font-size="26" font-weight="700" fill="#7fb6ff">با هم ببینیم، با هم لذت ببریم</text>

    <!-- two screens, one film: the playheads move together -->
    <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="13" font-weight="700" fill="#6f86b3" letter-spacing="1.5">
      <text x="434" y="276">HOST · PC</text>
      <text x="434" y="318">FRIEND · PC</text>
    </g>
    <g>
      <rect x="560" y="266" width="380" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="560" y="266" width="0" height="8" rx="4" fill="url(#track)">
        <animate attributeName="width" values="0;380;380" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <circle cx="560" cy="270" r="9" fill="#ffffff">
        <animate attributeName="cx" values="560;940;940" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
      </circle>

      <rect x="560" y="308" width="380" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="560" y="308" width="0" height="8" rx="4" fill="url(#track)">
        <animate attributeName="width" values="0;380;380" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <circle cx="560" cy="312" r="9" fill="#ffffff">
        <animate attributeName="cx" values="560;940;940" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
      </circle>

      <text x="966" y="297" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="15" font-weight="700" fill="#3ee0ff">in sync
        <animate attributeName="fill-opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
      </text>
    </g>


    <!-- what rises over the film: a reaction, a chat line, a voice -->
    <g opacity="0"><g transform="scale(1.6)"><path d="M12 21C12 21 3 14.5 3 8.5C3 5.5 5.3 3.5 8 3.5C9.8 3.5 11.2 4.5 12 5.8C12.8 4.5 14.2 3.5 16 3.5C18.7 3.5 21 5.5 21 8.5C21 14.5 12 21 12 21Z" fill="#ff4d7e"/></g><animateTransform attributeName="transform" type="translate" values="1060 300; 1042 96" dur="6s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></g>
    <g opacity="0"><g transform="scale(1.4)"><path d="M4 5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="#2b7fff"/><rect x="6" y="9" width="12" height="2" rx="1" fill="#ffffff"/><rect x="6" y="13" width="8" height="2" rx="1" fill="#ffffff"/></g><animateTransform attributeName="transform" type="translate" values="1150 300; 1164 96" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="6s" begin="1.5s" repeatCount="indefinite"/></g>
    <g opacity="0"><g transform="scale(1.5)"><rect x="8.5" y="2" width="7" height="12" rx="3.5" fill="#3ee0ff"/><path d="M5 11a7 7 0 0 0 14 0" fill="none" stroke="#3ee0ff" stroke-width="2" stroke-linecap="round"/><rect x="11" y="18" width="2" height="4" rx="1" fill="#3ee0ff"/></g><animateTransform attributeName="transform" type="translate" values="1110 300; 1100 96" dur="6s" begin="3.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="6s" begin="3.0s" repeatCount="indefinite"/></g>
    <g opacity="0"><g transform="scale(1.5)"><path d="M12 22c-4 0-7-2.8-7-6.8 0-3.4 2.3-5.4 3.6-7.2.6 1.7 1.6 2.6 2.4 2.6 0-3.2 1.1-6.3 3.8-8.6-.2 2.8 1.2 4.4 2.6 6 1.4 1.6 2.6 3.6 2.6 6.4 0 4-3 7.6-8 7.6z" fill="#ffb02e"/><path d="M12 22c-1.9 0-3.3-1.3-3.3-3.1 0-2 1.6-3 2.3-4.6.9 1.4 2.3 1.6 2.3 3 .8-.5 1.4-1.4 1.6-2.4 1 1.1 1.4 2.3 1.4 3.3 0 2.2-1.9 3.8-4.3 3.8z" fill="#ffe08a"/></g><animateTransform attributeName="transform" type="translate" values="1195 300; 1179 96" dur="6s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="6s" begin="4.5s" repeatCount="indefinite"/></g>

    <!-- the platform chip -->
    <g transform="translate(1050 34)">
      <rect width="196" height="40" rx="20" fill="#2b7fff" fill-opacity="0.16" stroke="#2b7fff" stroke-opacity="0.7"/>
      <g transform="translate(16 11)" fill="#ffffff">
        <rect width="8" height="8" rx="1"/><rect x="10" width="8" height="8" rx="1"/>
        <rect y="10" width="8" height="8" rx="1"/><rect x="10" y="10" width="8" height="8" rx="1"/>
      </g>
      <text x="44" y="26" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">WINDOWS 10 | 11</text>
    </g>
  </g>
</svg>
