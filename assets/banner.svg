<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Us Player for Windows — Watch together, enjoy together">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040815"/>
      <stop offset="0.55" stop-color="#081433"/>
      <stop offset="1" stop-color="#0d0a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b7fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2b7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a3cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a3cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0ff"/>
      <stop offset="0.45" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#6a3cff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#cfe2ff"/>
      <stop offset="1" stop-color="#6fb2ff"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee0ff"/>
      <stop offset="1" stop-color="#2b7fff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <circle cx="240" cy="180" r="230" fill="url(#glow)">
      <animate attributeName="r" values="215;240;215" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="40" r="260" fill="url(#glow2)"/>

    <!-- faint film-strip dots along the top and bottom edges -->
    <g fill="#ffffff" fill-opacity="0.05">
      <rect x="10" y="8" width="14" height="8" rx="2"/>
      <rect x="10" y="344" width="14" height="8" rx="2"/>
      <rect x="46" y="8" width="14" height="8" rx="2"/>
      <rect x="46" y="344" width="14" height="8" rx="2"/>
      <rect x="82" y="8" width="14" height="8" rx="2"/>
      <rect x="82" y="344" width="14" height="8" rx="2"/>
      <rect x="118" y="8" width="14" height="8" rx="2"/>
      <rect x="118" y="344" width="14" height="8" rx="2"/>
      <rect x="154" y="8" width="14" height="8" rx="2"/>
      <rect x="154" y="344" width="14" height="8" rx="2"/>
      <rect x="190" y="8" width="14" height="8" rx="2"/>
      <rect x="190" y="344" width="14" height="8" rx="2"/>
      <rect x="226" y="8" width="14" height="8" rx="2"/>
      <rect x="226" y="344" width="14" height="8" rx="2"/>
      <rect x="262" y="8" width="14" height="8" rx="2"/>
      <rect x="262" y="344" width="14" height="8" rx="2"/>
      <rect x="298" y="8" width="14" height="8" rx="2"/>
      <rect x="298" y="344" width="14" height="8" rx="2"/>
      <rect x="334" y="8" width="14" height="8" rx="2"/>
      <rect x="334" y="344" width="14" height="8" rx="2"/>
      <rect x="370" y="8" width="14" height="8" rx="2"/>
      <rect x="370" y="344" width="14" height="8" rx="2"/>
      <rect x="406" y="8" width="14" height="8" rx="2"/>
      <rect x="406" y="344" width="14" height="8" rx="2"/>
      <rect x="442" y="8" width="14" height="8" rx="2"/>
      <rect x="442" y="344" width="14" height="8" rx="2"/>
      <rect x="478" y="8" width="14" height="8" rx="2"/>
      <rect x="478" y="344" width="14" height="8" rx="2"/>
      <rect x="514" y="8" width="14" height="8" rx="2"/>
      <rect x="514" y="344" width="14" height="8" rx="2"/>
      <rect x="550" y="8" width="14" height="8" rx="2"/>
      <rect x="550" y="344" width="14" height="8" rx="2"/>
      <rect x="586" y="8" width="14" height="8" rx="2"/>
      <rect x="586" y="344" width="14" height="8" rx="2"/>
      <rect x="622" y="8" width="14" height="8" rx="2"/>
      <rect x="622" y="344" width="14" height="8" rx="2"/>
      <rect x="658" y="8" width="14" height="8" rx="2"/>
      <rect x="658" y="344" width="14" height="8" rx="2"/>
      <rect x="694" y="8" width="14" height="8" rx="2"/>
      <rect x="694" y="344" width="14" height="8" rx="2"/>
      <rect x="730" y="8" width="14" height="8" rx="2"/>
      <rect x="730" y="344" width="14" height="8" rx="2"/>
      <rect x="766" y="8" width="14" height="8" rx="2"/>
      <rect x="766" y="344" width="14" height="8" rx="2"/>
      <rect x="802" y="8" width="14" height="8" rx="2"/>
      <rect x="802" y="344" width="14" height="8" rx="2"/>
      <rect x="838" y="8" width="14" height="8" rx="2"/>
      <rect x="838" y="344" width="14" height="8" rx="2"/>
      <rect x="874" y="8" width="14" height="8" rx="2"/>
      <rect x="874" y="344" width="14" height="8" rx="2"/>
      <rect x="910" y="8" width="14" height="8" rx="2"/>
      <rect x="910" y="344" width="14" height="8" rx="2"/>
      <rect x="946" y="8" width="14" height="8" rx="2"/>
      <rect x="946" y="344" width="14" height="8" rx="2"/>
      <rect x="982" y="8" width="14" height="8" rx="2"/>
      <rect x="982" y="344" width="14" height="8" rx="2"/>
      <rect x="1018" y="8" width="14" height="8" rx="2"/>
      <rect x="1018" y="344" width="14" height="8" rx="2"/>
